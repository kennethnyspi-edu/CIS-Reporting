# assessor_targets.conf
# CIS-CAT Pro Assessor — Remote Target Definitions
#
# Format (one target per line, fields are tab- or space-separated):
#   <hostname_or_ip>  <benchmark_xml>  <profile_name>
#
# This file is referenced by run_assessor.sh and passed to Assessor-CLI.sh
# via the -t (target) and -b (benchmark) flags.
#
# Lines beginning with '#' are ignored.
# Blank lines are ignored.
#
# Example entries:
# ---------------------------------------------------------------------------
# HOST                  BENCHMARK XML                             PROFILE
# ---------------------------------------------------------------------------
# webserver01.corp.lan  CIS_Ubuntu_Linux_22.04_LTS_Benchmark.xml  Level 1 - Server
# winserver02.corp.lan  CIS_Microsoft_Windows_Server_2022.xml      Level 1 - Member Server
# dbserver03.corp.lan   CIS_Oracle_MySQL_8.0_Benchmark.xml         Level 1 - MySQL RDBMS
# ---------------------------------------------------------------------------
#
# Populate this file with your actual target hosts before the first run.
# Credentials for remote access are handled separately via AWX credentials
# or SSH key configuration in the Assessor properties file.
