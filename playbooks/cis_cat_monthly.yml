---
- name: "CIS-CAT Pro | Monthly Assessment Run"
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    # Path inside the AWX pod — matches project mount
    assessor_dir: "/var/lib/awx/projects/cis_assessor/Assessor"
    assessor_script: "{{ assessor_dir }}/run_assessor.sh"
    assessor_log_base: "{{ assessor_dir }}/logs"

    # AWX Runner mounts this Git project at a fixed path on the AWX node.
    # We use this to locate scripts/ without relying on playbook_dir,
    # which Runner resolves to /runner/project/playbooks (inside the
    # ephemeral container) rather than the actual project mount on disk.
    awx_project_dir: "/var/lib/awx/projects/cis-cat-awx"

    # ---------------------------------------------------------------
    # targets_config — injected via AWX Survey at launch time.
    # Each Job Template (Windows, Linux-Group-1, Linux-Group-2, etc.)
    # passes its own targets file, allowing independent schedules.
    #
    # Survey variable name : survey_targets_config
    # Survey question label: "Targets configuration file"
    # Survey default value : (see per-template awx_job_template.yml)
    #
    # The default below is a safety fallback only; it should always
    # be overridden by the survey when launching via AWX.
    # ---------------------------------------------------------------
    targets_config: >-
      {{ survey_targets_config
         | default(assessor_dir + '/config/targets_windows.conf') }}

  tasks:

  #  - name: "CIS-CAT | Deploy run_assessor.sh from Git project"
  #    ansible.builtin.copy:
  #      src: "{{ awx_project_dir }}/scripts/run_assessor.sh"
  #      dest: "{{ assessor_dir }}/run_assessor.sh"
  #      mode: "0750"
  #      owner: root
  #      group: "1000"
  #      remote_src: true
  #    become: true

    - name: "CIS-CAT | Validate targets_config was supplied"
      ansible.builtin.fail:
        msg: >-
          No targets_config was provided. Set it as an AWX Survey parameter
          (variable name: survey_targets_config) on the Job Template, or pass
          it as an extra variable at launch time.
      when: targets_config | length == 0

    - name: "CIS-CAT | Show active targets file"
      ansible.builtin.debug:
        msg: "Using targets config: {{ targets_config }}"

    - name: "CIS-CAT | Verify Assessor-CLI.sh exists"
      ansible.builtin.stat:
        path: "{{ assessor_dir }}/Assessor-CLI.sh"
      register: assessor_cli_stat
      failed_when: not assessor_cli_stat.stat.exists

    - name: "CIS-CAT | Read assessor password from file"
      ansible.builtin.shell:
        cmd: >
          cat /var/lib/awx/projects/cis_assessor/Assessor/config/.assessor_pass
        executable: /bin/bash
      register: assessor_password
      changed_when: false
      failed_when: false
      no_log: true
      # Whether this password is actually needed depends on the per-line
      # <boolean_encrypted> flags inside the targets file, which run_assessor.sh
      # parses at runtime. We always attempt to read it here; if no target
      # requires encryption, the script simply won't use it.

    - name: "CIS-CAT | Verify targets config exists"
      ansible.builtin.stat:
        path: "{{ targets_config }}"
      register: targets_stat
      failed_when: not targets_stat.stat.exists

    - name: "CIS-CAT | Verify log directory is writable"
      ansible.builtin.shell:
        cmd: >
          test -d "{{ assessor_log_base }}" &&
          test -w "{{ assessor_log_base }}" &&
          echo "writable"
        executable: /bin/bash
      register: log_dir_check
      failed_when: "'writable' not in log_dir_check.stdout"
      changed_when: false

    - name: "CIS-CAT | Verify scripts are executable"
      ansible.builtin.shell:
        cmd: >
          test -x "{{ assessor_dir }}/Assessor-CLI.sh" &&
          test -x "{{ assessor_dir }}/run_assessor.sh" &&
          echo "executable"
        executable: /bin/bash
      register: exec_check
      failed_when: "'executable' not in exec_check.stdout"
      changed_when: false

    - name: "CIS-CAT | Run monthly assessments"
      ansible.builtin.shell:
        cmd: "{{ assessor_script }}"
        executable: /bin/bash
      environment:
        #ASSESSOR_ENCRYPT_PASSWORD: "{{ assessor_password.stdout | default('') }}"
        # Consumed by run_assessor.sh — tells it which targets file to load
        TARGETS_CONFIG: "{{ targets_config }}"
      register: assessor_run
      async: 7200
      poll: 30
      ignore_errors: true
      #no_log: false

    - name: "CIS-CAT | Print assessment output"
      ansible.builtin.debug:
        msg: "{{ assessor_run.stdout_lines }}"
      when:
        - assessor_run.stdout_lines is defined
        - assessor_run.stdout_lines | length > 0

    - name: "CIS-CAT | Print errors if any"
      ansible.builtin.debug:
        msg: "{{ assessor_run.stderr_lines }}"
      when:
        - assessor_run is defined
        - assessor_run.stderr_lines is defined
        - assessor_run.stderr_lines | length > 0

    - name: "CIS-CAT | Fail if encrypt password not set"
      ansible.builtin.fail:
        msg: >-
          ASSESSOR_ENCRYPT_PASSWORD is not set.
          Attach the CIS-CAT Assessor credential to this Job Template.
      when:
        - assessor_run is defined
        - assessor_run.msg is defined
        - "'assessor_encrypt_password' in assessor_run.msg"

    - name: "CIS-CAT | Fail if assessments failed"
      ansible.builtin.fail:
        msg: >-
          One or more assessments failed.
          Check logs in {{ assessor_log_base }}
      when:
        - assessor_run is defined
        - assessor_run.rc is defined
        - assessor_run.rc != 0

    - name: "CIS-CAT | Clean up logs older than 90 days"
      ansible.builtin.find:
        paths: "{{ assessor_log_base }}"
        age: "90d"
        recurse: false
        file_type: directory
      register: old_logs

    - name: "CIS-CAT | Remove old log directories"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_logs.files }}"
      when: old_logs.files | length > 0
