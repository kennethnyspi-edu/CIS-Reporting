---
- name: "CIS-CAT Pro | Monthly Assessment Run"
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    # Path inside the AWX pod — matches project mount
    assessor_dir: "/var/lib/awx/projects/cis_assessor/Assessor"
    assessor_script: "{{ assessor_dir }}/run_assessor.sh"
    assessor_log_base: "{{ assessor_dir }}/logs"

    # AWX mounts this Git project at a fixed path on the AWX node, but
    # AWX prefixes the folder with the internal Project ID (e.g. "_87_"),
    # so it will NOT match the project's display name or repo name.
    # Verify the real path with:
    #   ls /var/lib/awx/projects/ | grep -i <some part of your repo name>
    # and update this value if the Project is ever deleted/recreated
    # (the ID, and therefore this path, will change).
    awx_project_dir: "/var/lib/awx/projects/_87__cis_assessor_reporting"

    # ---------------------------------------------------------------
    # targets_config — injected via AWX Survey at launch time.
    # Each Job Template (Windows, Linux-Group-1, Linux-Group-2, etc.)
    # passes its own targets file, allowing independent schedules.
    #
    # Survey variable name : survey_targets_config
    # Survey question label: "Targets configuration file"
    # Survey default value : (see per-template awx_job_template.yml)
    #
    # The default below is a safety fallback only; it should always
    # be overridden by the survey when launching via AWX.
    # ---------------------------------------------------------------
    targets_config: >-
      {{ survey_targets_config
         | default(assessor_dir + '/config/targets_windows.conf') }}

    # ---------------------------------------------------------------
    # per_target_timeout_seconds — optional AWX Survey override.
    # Caps how long Assessor-CLI may run against a single target before
    # being killed, so one hung/unreachable host doesn't block the rest
    # of the targets list. Passed through to run_assessor.sh, which
    # itself defaults to 1800 (30 min) if this isn't set at all.
    #
    # Survey variable name : survey_per_target_timeout_seconds
    # ---------------------------------------------------------------
    per_target_timeout_seconds: >-
      {{ survey_per_target_timeout_seconds | default('1800') }}

    # ---------------------------------------------------------------
    # awx_async_timeout_seconds — total time budget for the entire
    # run_assessor.sh execution, covering ALL targets combined.
    # Must be larger than (number_of_targets × per_target_timeout_seconds)
    # plus overhead. Defaults to 86400s (24h) so a large target list
    # never hits the AWX-level async timeout before the per-target
    # timeouts inside the script have had a chance to fire.
    #
    # Survey variable name : survey_awx_async_timeout_seconds
    # ---------------------------------------------------------------
    awx_async_timeout_seconds: >-
      {{ survey_awx_async_timeout_seconds | default('86400') | int }}

    # ---------------------------------------------------------------
    # Email reporting — optional AWX Survey overrides.
    # send_email defaults to false so existing Job Templates keep their
    # current behavior unless explicitly opted in via the survey.
    #
    # Survey variable names:
    #   survey_send_email   (boolean / multiplechoice TRUE|FALSE)
    #   survey_mail_to      (text, comma-separated if multiple addresses)
    #   survey_mail_cc      (text, optional)
    # ---------------------------------------------------------------
    send_email: "{{ survey_send_email | default(false) | bool }}"
    mail_from: "cis-cat-assessor@nyspi.org"
    mail_to: >-
      {{ (survey_mail_to | default('') ).split(',') | map('trim') | select | list }}
    mail_cc: >-
      {{ (survey_mail_cc | default('') ).split(',') | map('trim') | select | list
         if (survey_mail_cc | default('')) | length > 0 else omit }}
    # SMTP relay — use IP directly to avoid DNS resolution failures inside
    # the AWX Runner container, which cannot resolve .nyspi.local hostnames.
    smtp_host: "10.20.193.83"
    smtp_port: 25
    smtp_secure: "never"

  tasks:

    - name: "CIS-CAT | Verify Git project source script exists"
      ansible.builtin.stat:
        path: "{{ awx_project_dir }}/scripts/run_assessor.sh"
      register: source_script_stat
      failed_when: not source_script_stat.stat.exists
      # If this fails, awx_project_dir almost certainly does not match
      # the real AWX project mount path. AWX prefixes project folders
      # with the internal Project ID (e.g. "_87_<repo-name>"), and that
      # ID changes if the Project is ever deleted and recreated.
      # Run on the AWX node: ls /var/lib/awx/projects/ | grep -i <repo-name>

    - name: "CIS-CAT | Deploy run_assessor.sh from Git project"
      ansible.builtin.copy:
        src: "{{ awx_project_dir }}/scripts/run_assessor.sh"
        dest: "{{ assessor_dir }}/run_assessor.sh"
        mode: "0750"
        remote_src: true
      # No 'become' here: the AWX execution environment has no sudo
      # binary, and the job already runs as whatever user owns the
      # project/assessor mounts (no privilege escalation needed).
      # Dropped explicit owner/group for the same reason -- chown
      # would also require escalation. The existing file ownership
      # on assessor_dir is preserved; only the mode is set.

    - name: "CIS-CAT | Validate targets_config was supplied"
      ansible.builtin.fail:
        msg: >-
          No targets_config was provided. Set it as an AWX Survey parameter
          (variable name: survey_targets_config) on the Job Template, or pass
          it as an extra variable at launch time.
      when: targets_config | length == 0

    - name: "CIS-CAT | Show active targets file"
      ansible.builtin.debug:
        msg: "Using targets config: {{ targets_config }}"

    - name: "CIS-CAT | Verify Assessor-CLI.sh exists"
      ansible.builtin.stat:
        path: "{{ assessor_dir }}/Assessor-CLI.sh"
      register: assessor_cli_stat
      failed_when: not assessor_cli_stat.stat.exists

    - name: "CIS-CAT | Read assessor password from file"
      ansible.builtin.shell:
        cmd: >
          cat /var/lib/awx/projects/cis_assessor/Assessor/config/.assessor_pass
        executable: /bin/bash
      register: assessor_password
      changed_when: false
      failed_when: false
      no_log: true
      # Whether this password is actually needed depends on the per-line
      # <boolean_encrypted> flags inside the targets file, which run_assessor.sh
      # parses at runtime. We always attempt to read it here; if no target
      # requires encryption, the script simply won't use it.

    - name: "CIS-CAT | Verify targets config exists"
      ansible.builtin.stat:
        path: "{{ targets_config }}"
      register: targets_stat
      failed_when: not targets_stat.stat.exists

    - name: "CIS-CAT | Verify log directory is writable"
      ansible.builtin.shell:
        cmd: >
          test -d "{{ assessor_log_base }}" &&
          test -w "{{ assessor_log_base }}" &&
          echo "writable"
        executable: /bin/bash
      register: log_dir_check
      failed_when: "'writable' not in log_dir_check.stdout"
      changed_when: false

    - name: "CIS-CAT | Verify scripts are executable"
      ansible.builtin.shell:
        cmd: >
          test -x "{{ assessor_dir }}/Assessor-CLI.sh" &&
          test -x "{{ assessor_dir }}/run_assessor.sh" &&
          echo "executable"
        executable: /bin/bash
      register: exec_check
      failed_when: "'executable' not in exec_check.stdout"
      changed_when: false

    - name: "CIS-CAT | Run monthly assessments"
      ansible.builtin.shell:
        cmd: "{{ assessor_script }}"
        executable: /bin/bash
      environment:
        ASSESSOR_ENCRYPT_PASSWORD: "{{ assessor_password.stdout | default('') }}"
        # Consumed by run_assessor.sh — tells it which targets file to load
        TARGETS_CONFIG: "{{ targets_config }}"
        # Consumed by run_assessor.sh — caps per-target Assessor-CLI runtime
        PER_TARGET_TIMEOUT_SECONDS: "{{ per_target_timeout_seconds }}"
      register: assessor_run
      async: "{{ awx_async_timeout_seconds }}"
      poll: 30
      ignore_errors: true
      no_log: false

    - name: "CIS-CAT | Print assessment output"
      ansible.builtin.debug:
        msg: "{{ assessor_run.stdout_lines }}"
      when:
        - assessor_run.stdout_lines is defined
        - assessor_run.stdout_lines | length > 0

    - name: "CIS-CAT | Print errors if any"
      ansible.builtin.debug:
        msg: "{{ assessor_run.stderr_lines }}"
      when:
        - assessor_run is defined
        - assessor_run.stderr_lines is defined
        - assessor_run.stderr_lines | length > 0

    - name: "CIS-CAT | Fail if encrypt password not set"
      ansible.builtin.fail:
        msg: >-
          ASSESSOR_ENCRYPT_PASSWORD is not set.
          Attach the CIS-CAT Assessor credential to this Job Template.
      when:
        - assessor_run is defined
        - assessor_run.msg is defined
        - "'assessor_encrypt_password' in assessor_run.msg"

    - name: "CIS-CAT | Clean up logs older than 90 days"
      ansible.builtin.find:
        paths: "{{ assessor_log_base }}"
        age: "90d"
        recurse: false
        file_type: directory
      register: old_logs

    - name: "CIS-CAT | Remove old log directories"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_logs.files }}"
      when: old_logs.files | length > 0

    - name: "CIS-CAT | Generate and email run report"
      ansible.builtin.include_tasks: "{{ awx_project_dir }}/playbooks/report.yml"
      # Runs regardless of whether individual targets passed or failed,
      # so a partial-failure run still gets reported. Only skipped if
      # the assessor run itself never produced output at all (e.g. it
      # failed before writing any JSON summary -- report.yml's own
      # "Fail clearly if no JSON summary was found" task handles that
      # case explicitly rather than silently skipping).
      when: assessor_run is defined

    - name: "CIS-CAT | Fail if assessments failed"
      ansible.builtin.fail:
        msg: >-
          One or more assessments failed.
          Check logs in {{ assessor_log_base }}
      when:
        - assessor_run is defined
        - assessor_run.rc is defined
        - assessor_run.rc != 0
